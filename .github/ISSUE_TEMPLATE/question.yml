name: Question
description: Ask how to do something with the theme
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What do you want to do?
      description: Say which doc page you read (docs/features/...) and what is still unclear.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "node v22.12.0, pnpm 11.9.0"
