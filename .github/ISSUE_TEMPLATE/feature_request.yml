name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This theme stays small on purpose (see "What is in scope" in CONTRIBUTING.md). Features that need accounts, databases or dashboards are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
